# Bracketed Segments — Catppuccin Macchiato palette, Nerd Font glyphs
# Tailored for Java / Spring Boot / Kubernetes / Docker

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$java\
$kotlin\
$gradle\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

# ─── Prompt ───────────────────────────────────────
[character]
success_symbol = "[❯](bold #a6da95)"
error_symbol = "[❯](bold #ed8796)"

# ─── Directory ────────────────────────────────────
[directory]
truncation_length = 3
truncation_symbol = "…/"
format = '\[[ $path]($style)\] '
style = "bold #8aadf4"

# ─── Git Branch ───────────────────────────────────
[git_branch]
format = '\[[$symbol$branch]($style)\] '
symbol = " "
style = "bold #c6a0f6"
truncation_length = 24

# ─── Git Status ───────────────────────────────────
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "#f5a97f"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
up_to_date = "✓"

# ─── Java ─────────────────────────────────────────
[java]
format = '\[[ $version]($style)\] '
style = "bold #ed8796"
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", "build.sbt", ".java-version"]
detect_extensions = ["java", "class", "jar"]

# ─── Kotlin ───────────────────────────────────────
[kotlin]
format = '\[[ $version]($style)\] '
style = "bold #c6a0f6"

# ─── Gradle ───────────────────────────────────────
[gradle]
format = '\[[ $version]($style)\] '
style = "bold #8bd5ca"

# ─── Docker ───────────────────────────────────────
[docker_context]
format = '\[[ $context]($style)\] '
style = "bold #7dc4e4"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ─── Kubernetes ───────────────────────────────────
[kubernetes]
disabled = false
format = '\[[󱃾 $context($namespace)]($style)\] '
style = "bold #91d7e3"
detect_files = ["k8s", "kubernetes", "kustomization.yaml"]

[kubernetes.context_aliases]
"arn:aws:eks:.*:.*:cluster/(.+)" = "$1"

# ─── Command Duration ────────────────────────────
[cmd_duration]
min_time = 3_000
format = '\[[ $duration]($style)\] '
style = "bold #eed49f"

# ─── Username (SSH only) ─────────────────────────
[username]
show_always = false
format = '\[[$user]($style)\] '
style_user = "#b8c0e0"
style_root = "bold #ed8796"

# ─── Hostname (SSH only) ─────────────────────────
[hostname]
ssh_only = true
format = '\[[$ssh_symbol$hostname]($style)\] '
style = "#a5adcb"
trim_at = "-"

# ─── Disabled modules (reduce noise) ─────────────
[azure]
disabled = true

[battery]
disabled = true

[time]
disabled = true

[memory_usage]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[php]
disabled = true
