# Bracketed Segments — Catppuccin Macchiato palette, Nerd Font glyphs
# Tailored for Java / Spring Boot / Kubernetes / Terraform / Docker

add_newline = true
command_timeout = 2000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$java\
$gradle\
$terraform\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

# ─── Prompt ───────────────────────────────────────
[character]
success_symbol = "[❯](bold #a6da95)"
error_symbol = "[❯](bold #ed8796)"

# ─── Directory ────────────────────────────────────
[directory]
truncation_length = 3
truncation_symbol = "…/"
format = '\[[ $path]($style)\] '
style = "bold #8aadf4"

# ─── Git Branch ───────────────────────────────────
[git_branch]
format = '\[[$symbol$branch]($style)\] '
symbol = " "
style = "bold #c6a0f6"
truncation_length = 24

# ─── Git Status ───────────────────────────────────
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "#f5a97f"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
up_to_date = "✓"

# ─── Java ─────────────────────────────────────────
[java]
format = '\[[ $version]($style)\] '
style = "bold #ed8796"
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts", "build.sbt", ".java-version"]
detect_extensions = ["java", "class", "jar"]

# ─── Kotlin (disabled — no Kotlin in stack; lights up on Gradle-Kotlin projects) ──
[kotlin]
disabled = true

# ─── Gradle (disabled — redundant with [java]; java module already detects build.gradle) ──
[gradle]
disabled = true

# ─── Terraform ────────────────────────────────────
[terraform]
format = '\[[ $workspace]($style)\] '
style = "bold #f5a97f"

# ─── Docker ───────────────────────────────────────
[docker_context]
format = '\[[ $context]($style)\] '
style = "bold #7dc4e4"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ─── Kubernetes ───────────────────────────────────
# always-on (disabled=false, no detect_files/folders): context is always
# relevant when working with EKS/K8s, and there is no reliable file trigger
# for infra work (old detect_files ["k8s","kubernetes"] matched files not
# dirs and were no-ops). context_from_config not supported in starship 1.25.x.
[kubernetes]
disabled = false
format = '\[[󱃾 $context($namespace)]($style)\] '
style = "bold #91d7e3"

[kubernetes.context_aliases]
"arn:aws:eks:.*:.*:cluster/(.+)" = "$1"

# ─── Command Duration ────────────────────────────
[cmd_duration]
min_time = 3_000
format = '\[[ $duration]($style)\] '
style = "bold #eed49f"

# ─── Username (SSH only) ─────────────────────────
[username]
show_always = false
format = '\[[$user]($style)\] '
style_user = "#b8c0e0"
style_root = "bold #ed8796"

# ─── Hostname (SSH only) ─────────────────────────
[hostname]
ssh_only = true
format = '\[[$ssh_symbol$hostname]($style)\] '
style = "#a5adcb"
trim_at = "-"

# ─── Disabled modules (reduce noise) ─────────────
[azure]
disabled = true

[battery]
disabled = true

[time]
disabled = true

[memory_usage]
disabled = true

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[php]
disabled = true

# AWS: disabled to prevent unexpected appearance when AWS_PROFILE/AWS_REGION env
# vars are set (e.g. from ~/.aws/config or shell exports). Enable and style
# if you want compact profile/region on the prompt.
[aws]
disabled = true

# GCloud: disabled — primary cloud provider is AWS/EKS, not GCP.
[gcloud]
disabled = true
