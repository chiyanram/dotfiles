# Pre-commit hooks for dotfiles validation
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

# Vendored skill content stays exactly as upstream ships it (bytes are hashed
# in skills-lock.json, template scripts are deliberately non-executable) —
# our hooks don't police it. Prettier has the same carve-out in .prettierignore.
exclude: ^\.claude/skills/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: '^(bin/[^/]+|bin/lib/[^/]+\.sh|setup\.sh|bootstrap\.sh)$'
        exclude: '^bin/git-clc$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Auto-format Markdown. Markdown-only (types_or) so it doesn't fight the
  # check-yaml/json/toml hooks above. `dot test` runs the same prettier in
  # --check mode; keep its pinned version in sync with the rev below.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.4
    hooks:
      - id: prettier
        types_or: [markdown]

default_install_hook_types: [pre-commit]
